name: Receive PR

# Runs the test suite on pull requests. The suite needs no credentials beyond
# `codecov_token`: tests that reach live NASA Earthdata are marked `integration`
# and excluded everywhere in CI, and the ATL06 comparison they cover runs here
# against committed structure-only fixtures instead.
on:
  pull_request:
    # Matched against the base branch (the branch the PR targets).
    branches: [ develop, main, feature/**, issue/**, issues/** ]

jobs:
  run_tests:
    uses: ./.github/workflows/run_tests.yml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
