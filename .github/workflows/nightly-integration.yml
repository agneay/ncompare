# Exercises the live NASA Earthdata path: authenticating, downloading real ATL06
# granules, and comparing them.
#
# These tests are deliberately kept off the merge path. They depend on services
# outside this repository, so a NASA outage or a runner networking problem used to
# be able to turn `develop` red for reasons unrelated to any code change. Running
# them on a schedule keeps that signal without gating merges.
#
# The structural half of this coverage is not deferred to the nightly: the same
# ATL06 comparison runs on every push and pull request as an ordinary unit test,
# against committed structure-only fixtures (see
# scripts/make_atl06_structural_fixtures.py). What only the nightly can tell us is
# whether the real granules still match those fixtures -- if NASA reprocesses
# ATL06, this is where it shows up.
#
# A failure here means one of:
#   - Earthdata was unavailable (check https://status.earthdata.nasa.gov, or call
#     earthaccess.status()) -- usually transient; re-run to confirm.
#   - ATL06 was reprocessed, so the difference count moved. Regenerate the
#     fixtures with scripts/make_atl06_structural_fixtures.py and update
#     EXPECTED_ATL06_DIFFERENCES in tests/test_core.py.
#   - earthaccess or CMR changed in a way that breaks download or auth.

name: Nightly integration tests against live Earthdata

on:
  schedule:
    # 07:37 UTC daily. Off the hour on purpose, to avoid the thundering herd of
    # jobs scheduled at :00 (which GitHub delays under load).
    - cron: '37 7 * * *'
  workflow_dispatch:

jobs:
  integration_tests:
    # Passing the Earthdata credentials is what enables the integration step in
    # the reusable workflow; it skips that step whenever they are absent.
    uses: ./.github/workflows/run_tests.yml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
